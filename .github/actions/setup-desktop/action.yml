name: Set up desktop build
description: Install pinned Node, repository-pinned Rust, and Linux Tauri prerequisites.
runs:
  using: composite
  steps:
    - name: Install Tauri Linux prerequisites
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends -y \
          build-essential pkg-config libssl-dev libwebkit2gtk-4.1-dev \
          libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
          libxdo-dev patchelf xdg-utils
    - name: Set up Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22.23.3'
        cache: npm
        cache-dependency-path: package-lock.json
    - name: Install repository-pinned Rust toolchain
      shell: bash
      run: |
        rustup show
        rustup component add rustfmt clippy
        rustc --version --verbose
        cargo --version
    - name: Install locked frontend dependencies
      shell: bash
      run: npm ci
