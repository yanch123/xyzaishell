# design-v0.1 Linux 软件管理格式示意，不是可直接连接的凭据文件。
# 密码／私钥口令保存在本机 Secret Service 兼容安全存储；文件只放不透明引用。
# 以下 *_secret_ref 均是假占位，不是有效引用，更不能填明文密码。
# 安全存储不可用时不明文回退；用户可显式选择 session_only 并移除全部引用字段。
schema_version = 1
revision = 0

[storage]
secret_protection = "linux_secret_service"

[[connections]]
id = "EXAMPLE_PASSWORD_PROFILE"
label = "示例 Linux 密码连接"
host = "server.example.invalid"
port = 22
username = "REPLACE_WITH_SSH_ACCOUNT"

[connections.auth]
kind = "password"
password_secret_ref = "SECRET_REF_PLACEHOLDER_NOT_A_REAL_ITEM"

[[connections]]
id = "EXAMPLE_KEY_PROFILE"
label = "示例 Linux 私钥连接"
host = "key-server.example.invalid"
port = 22
username = "REPLACE_WITH_SSH_ACCOUNT"

[connections.auth]
kind = "private_key"
# 使用绝对 POSIX 路径；应用不展开 ~ 或 $HOME，不复制私钥。
private_key_path = '/home/EXAMPLE/.ssh/id_ed25519'
# 仅在保存加密私钥口令时由应用生成；不需要时省略。
passphrase_secret_ref = "SECRET_REF_PLACEHOLDER_NOT_A_REAL_ITEM"
