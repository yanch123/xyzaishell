[package]
name = "xyz-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
base64 = "0.22"
sha2 = "0.10"
bytes = "1"
libc = "0.2"
futures = "0.3"
rig-core = { version = "=0.44.0", default-features = false }
rig-reqwest = { version = "=0.44.0", default-features = false, features = ["rustls"] }
toml = "0.9"
url = "2"
russh = { version = "=0.64.1", default-features = false, features = ["ring", "rsa"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1"
rusqlite = { version = "=0.37.0", features = ["bundled", "limits"] }

[dev-dependencies]
rand = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Wdk_System_SystemServices", "Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_SystemServices"] }

[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "=5.2.0", default-features = false, features = ["rt-async-io-crypto-rust"] }
zbus = { version = "5", default-features = false, features = ["async-io"] }
